[package]
name = "ale-term"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
ale-agents = { version = "0.1.0", path = "../agents" }
ale-config = { version = "0.1.0", path = "../config" }
ale-core = { version = "0.1.0", path = "../core" }
ale-render = { version = "0.1.0", path = "../render" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
arboard = "3.7.0"
env_logger = "0.11.12"
log = "0.4.35"
pollster = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
