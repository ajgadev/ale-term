# ale-term configuration.
# Changes are applied as soon as you save this file.
# Every setting is optional; the values below are the defaults.

[font]
family = "Menlo"
size = 13.0
line_height = 1.25
# Join pairs such as -> and != when the font has ligatures.
ligatures = true

[window]
width = 1100.0
height = 700.0
padding = 8.0
# Reopen the previous workspaces, tabs and splits at launch.
restore = true

[terminal]
scrollback = 10000
# shell = "/bin/zsh"
# shell_args = ["-l"]
# Send ESC + key for Option combinations instead of composing characters.
option_as_meta = false
scroll_multiplier = 3.0
# Let zsh report its folder, prompts and running command to the terminal.
shell_integration = true
# Memory budget for inline images, in megabytes.
image_memory_mb = 128

[theme]
# "auto" follows the macOS appearance; or force "dark" / "light".
mode = "auto"

# Override individual colors of the built-in themes, for example:
# [theme.dark]
# background = "#101014"
# foreground = "#e6e6e6"
# cursor = "#e6e6e6"
# selection = "#33467c"
# accent = "#d97757"
# ansi = ["#000000", ...]   # exactly 16 colors
#
# [theme.light]
# background = "#ffffff"

# Workspaces: the tabs to open for a project, in one go, from the workspace
# switcher (Cmd+P). Add one [[workspace]] block per project, for example:
#
# [[workspace]]
# root = "~/Dev/my-project"
# tabs = [
#   { title = "agent", command = "claude" },
#   { title = "server", command = "npm run dev" },
#   { title = "git" },
# ]
#
# A project can also carry its own list in a `.ale-term.toml` file at its
# root (same `tabs = [...]` format). ale-term asks before running commands
# from such a file.
