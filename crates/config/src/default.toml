# ale-term configuration.
# Changes are applied as soon as you save this file.
# Every setting is optional; the values below are the defaults.

[font]
family = "Menlo"
size = 13.0
line_height = 1.25
# Join pairs such as -> and != when the font has ligatures.
ligatures = true

[window]
width = 1100.0
height = 700.0
padding = 8.0
# Reopen the previous workspaces, tabs and splits at launch.
restore = true
# How the window is drawn: "cpu" uses the least memory; "gpu" is faster for
# very large windows under heavy output but uses about 90 MB more while the
# screen is changing. Takes effect at the next launch.
renderer = "cpu"

[terminal]
# The most lines of history a pane keeps. Each costs memory across the
# whole width of the pane, so a wide pane with 5000 can use over 20 MB.
scrollback = 5000
# Memory the history of all panes may use together, in megabytes. When
# they hold more, the panes holding the most lose their oldest lines.
# 0 lets every pane keep its full `scrollback`.
scrollback_memory_mb = 16
# shell = "/bin/zsh"
# shell_args = ["-l"]
# Send ESC + key for Option combinations instead of composing characters.
option_as_meta = false
scroll_multiplier = 3.0
# Let zsh report its folder, prompts and running command to the terminal.
shell_integration = true
# Memory budget for inline images, in megabytes.
image_memory_mb = 128

[agents]
# Where agents are shown: "sidebar" lists them down the left side; "board"
# puts them as cards in columns (Needs you, Working, Done, Idle) above the
# tabs. The button at the right end of the tab bar switches between them.
layout = "sidebar"
# Show the sidebar (or the board) at launch (toggle: Cmd+B).
sidebar = true
sidebar_width = 260.0
# Rows of cards the board shows before a column scrolls.
board_rows = 2
# Play a sound when an agent is stuck waiting for you (a permission prompt, a
# question, an error). Off by default. A finished turn never makes a sound.
sound = false
# Show a macOS notification for the same, when the window is not in front.
# Off by default.
notifications = false
# Bounce the Dock icon for the same, when the window is not in front.
dock_bounce = true
# The agent command the new-session page (Shift+Cmd+T) starts with.
new_session_command = "claude"

[theme]
# "auto" follows the macOS appearance; or force "dark" / "light".
mode = "auto"

# Override individual colors of the built-in themes, for example:
# [theme.dark]
# background = "#101014"
# foreground = "#e6e6e6"
# cursor = "#e6e6e6"
# selection = "#33467c"
# accent = "#d97757"
# ansi = ["#000000", ...]   # exactly 16 colors
#
# [theme.light]
# background = "#ffffff"

# Workspaces: the tabs to open for a project, in one go, from the workspace
# switcher (Cmd+P). Add one [[workspace]] block per project, for example:
#
# [[workspace]]
# root = "~/Dev/my-project"
# tabs = [
#   { title = "agent", command = "claude" },
#   { title = "server", command = "npm run dev" },
#   { title = "git" },
# ]
#
# A project can also carry its own list in a `.ale-term.toml` file at its
# root (same `tabs = [...]` format). ale-term asks before running commands
# from such a file.
