[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/config", "crates/app", "crates/agents"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Rendering and parsing are too slow to use unoptimized, even while developing.
[profile.dev.package."*"]
opt-level = 2
